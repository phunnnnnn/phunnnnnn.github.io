<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games | Phunn</title>
  <meta name="description" content="Every game made by Phunn (Pannatat Chaikaew): Roblox and Godot games, with gameplay previews." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Games | Phunn" />
  <meta property="og:description" content="Every game I've made, in Roblox and Godot." />
  <meta property="og:image" content="https://www.phunn.me/assets/phunn.png" />
  <meta property="og:url" content="https://www.phunn.me/games" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#16143f" />
  <link rel="icon" type="image/png" href="assets/phunn.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500&family=Noto+Sans+Thai+Looped:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=17" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <!-- Navigation -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a href="/" class="nav__brand">
        <img src="assets/phunn.png" alt="" />
        <span class="nav__brand-text">
          <strong>Phunn</strong>
          <small data-i18n="nav.role">Game Developer</small>
        </span>
      </a>
      <nav aria-label="Main">
        <ul class="nav__pill">
          <li><a href="/" data-i18n="nav.home">Home</a></li>
          <li><a href="/games" class="active" aria-current="page" data-i18n="nav.games">Games</a></li>
          <li><a href="/info" data-i18n="nav.info">Info</a></li>
        </ul>
      </nav>
      <div class="nav__controls">
        <div class="lang-pill" role="group" aria-label="Language">
          <button type="button" data-lang-btn="th" aria-pressed="false">TH</button>
          <button type="button" data-lang-btn="en" aria-pressed="true">ENG</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Games page: the tiles come from projectData in content.js -->
  <main>
    <section class="section">
      <div class="container">
        <h1 class="section__title shuffle-text" data-i18n="games.title">All games</h1>
        <p class="section__lead" data-i18n="games.lead">Everything I've made.</p>
        <div class="filter-pill" id="gameFilters" role="group" aria-label="Filter"></div>
        <div class="game-grid" id="gameGrid"></div>
        <p class="game-grid__empty" id="gameEmpty" data-i18n="games.empty" hidden>Nothing here yet.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <strong>Phunn<span class="serif">.</span></strong>
        <p>© <span id="year"></span> Pannatat Chaikaew</p>
      </div>
      <div class="footer__cols">
        <div>
          <p class="label">Main</p>
          <a href="/" data-i18n="nav.home">Home</a>
          <a href="/games" data-i18n="nav.games">Games</a>
          <a href="/info" data-i18n="nav.info">Info</a>
        </div>
        <div>
          <p class="label">Contact</p>
          <a href="https://fastwork.com/user/phunn" target="_blank" rel="noopener">Fastwork ↗</a>
          <a href="https://discord.gg/rVgktUzHR3" target="_blank" rel="noopener">Discord ↗</a>
          <a href="https://www.youtube.com/@phunnnnnn" target="_blank" rel="noopener">YouTube ↗</a>
          <a href="mailto:phunn.chaikaew@gmail.com">Email ↗</a>
        </div>
      </div>
    </div>
  </footer>
  <script src="content.js?v=20"></script>
  <script src="script.js?v=17"></script>
</body>
</html>
